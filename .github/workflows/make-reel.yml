name: make-reel
# Makes one AI reel (plan -> Gemini clips + voice + music -> edit -> check) and sends it to Telegram for approval.
on:
  workflow_dispatch:
    inputs:
      brief: { description: "idea (blank = engine picks)", required: false, default: "" }
      res: { description: "AI video resolution: 360p (draft) / 720p", required: false, default: "720p" }
      mode: { description: "auto (plan+build+queue, default) / plan (storyboard for approval) / build / revise", required: false, default: "auto" }
      id: { description: "storyboard id (build/revise)", required: false, default: "" }
      feedback: { description: "owner changes (revise)", required: false, default: "" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper mediapipe opencv-python-headless pillow numpy || true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Self-test (no API)
        run: ffmpeg -version | head -1 && python3 social/engine/make_reel.py --selftest
      - id: make
        if: github.event.inputs.brief != 'selftest'
        env: { BRIEF: "${{ github.event.inputs.brief }}", FEEDBACK: "${{ github.event.inputs.feedback }}" }
        run: python3 social/engine/make_reel.py --mode "${{ github.event.inputs.mode || 'auto' }}" --id "${{ github.event.inputs.id }}" --brief "$BRIEF" --feedback "$FEEDBACK" --res "${{ github.event.inputs.res }}"
      - if: github.event.inputs.brief != 'selftest' && github.event.inputs.mode == 'build'
        run: python3 social/tg.py send "${{ steps.make.outputs.id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reel-work, path: "work/**/*.mp4", if-no-files-found: ignore, retention-days: 7 }
      - name: Save state
        if: always()
        run: |
          git config user.name "vajra-bot"
          git config user.email "vajra-bot@users.noreply.github.com"
          git add social
          git diff --cached --quiet && exit 0
          git commit -m "bot: new reel ${{ steps.make.outputs.id }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
