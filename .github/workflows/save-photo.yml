name: save-photo
# Photos sent to the Telegram group are saved to social/inbox/ (Apps Script starts this with the Telegram file_id).
on:
  workflow_dispatch:
    inputs:
      file_id: { description: "Telegram file_id", required: true }
      who: { description: "sender", required: false, default: "" }
      note: { description: "caption", required: false, default: "" }
permissions: { contents: write }
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      FID: ${{ github.event.inputs.file_id }}
      WHO: ${{ github.event.inputs.who }}
      NOTE: ${{ github.event.inputs.note }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          api = f"https://api.telegram.org/bot{os.environ['TOKEN']}/"
          path = json.load(urllib.request.urlopen(api + "getFile?file_id=" + os.environ["FID"]))["result"]["file_path"]
          os.makedirs("social/inbox", exist_ok=True)
          name = time.strftime("%Y%m%d-%H%M%S", time.gmtime(time.time() + 19800)) + "-" + (os.environ["WHO"] or "x").replace(" ", "")[:12] + os.path.splitext(path)[1]
          urllib.request.urlretrieve(f"https://api.telegram.org/file/bot{os.environ['TOKEN']}/{path}", "social/inbox/" + name)
          open("social/inbox/" + name + ".txt", "w").write((os.environ["WHO"] + ": " + os.environ["NOTE"]).strip())
          print("saved", name)
          PY
      - run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add social/inbox; git commit -qm "inbox: photo from $WHO"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
