name: library-reel
# Daily (GitHub schedule 06:30 UTC = 12:00 IST; late runs are harmless): if fewer than 4 reels are pending,
# make ONE reel from the clip library (fresh clips only) and add it to the queue. Manual run: force=true.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      force: { description: "make one even if 4+ reels pending", required: false, default: "false" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 social/engine/library_reel.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Save
        if: always()
        run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add social assets; git diff --cached --quiet && exit 0
          git commit -qm "bot: library reel"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
