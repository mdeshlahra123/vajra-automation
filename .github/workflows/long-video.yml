name: long-video
# Weekly long educational video (owner, 11 Nov). Monday 10:00 IST: plan + Flow brief. Thursday 10:00 IST: build + publish
# (YouTube long + Facebook video + 2 Shorts into the queue). Late GitHub schedules are harmless here.
on:
  schedule:
    - cron: '30 4 * * 1'   # Mon: plan
    - cron: '30 4 * * 4'   # Thu: build + publish
  workflow_dispatch:
    inputs:
      mode: { description: "plan / build", required: true, default: "plan" }
      id: { description: "long-MMDD (build; blank = latest plan)", required: false, default: "" }
      topic: { description: "topic number (plan; blank = next)", required: false, default: "" }
      publish: { description: "true = publish after build", required: false, default: "true" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
      YT_TOKEN: ${{ secrets.YT_TOKEN }}
      WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: timeout 400 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null'
      - run: pip install -q faster-whisper || true
      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then [ "$(date -u +%u)" = "1" ] && MODE=plan || MODE=build; fi
          if [ "$MODE" = "plan" ]; then
            T="${{ github.event.inputs.topic }}"; python3 social/engine/long_video.py plan ${T:+--topic $T}
          else
            NP=""; [ "${{ github.event.inputs.publish }}" = "false" ] && NP="--no-publish"
            I="${{ github.event.inputs.id }}"; python3 social/engine/long_video.py build ${I:+--id $I} $NP
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: long-video, path: "work/long-*/long-*.mp4", if-no-files-found: ignore, retention-days: 14 }
      - name: Save
        if: always()
        run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add social assets; git diff --cached --quiet && exit 0
          git commit -qm "bot: long video"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
      - name: Publish shorts to the website
        if: success()
        run: python3 social/publish_site.py || true
