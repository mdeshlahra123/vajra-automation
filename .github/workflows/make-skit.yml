name: make-skit
# Manual: build the open skit from 3 library clips in part order (when auto-matching in make-real.yml missed),
# then send it for approval. Normal path is automatic: make-real.yml -> skit_match.py.
on:
  workflow_dispatch:
    inputs:
      files: { description: "3 clip names in assets/clips, parts 1,2,3 in order (comma separated)", required: true }
      title: { description: "set = build these clips as a series episode with this title (not the daily skit)", required: false, default: "" }
      hook: { description: "caption hook (with title)", required: false, default: "" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - id: skit
        env: { FILES: "${{ github.event.inputs.files }}", TITLE: "${{ github.event.inputs.title }}", HOOK: "${{ github.event.inputs.hook }}" }
        run: |
          if [ -n "$TITLE" ]; then
            F=$(echo "$FILES" | tr "," "\n" | sed "s#^#assets/clips/#" | paste -sd, -)
            python3 social/engine/make_skit.py --files "$F" --title "$TITLE" --hook "$HOOK" | tee out.txt
            echo "skit_id=$(grep ^SKIT_ID= out.txt | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          else python3 social/engine/skit_match.py --order "$FILES"; fi
      - name: Send for approval
        if: steps.skit.outputs.skit_id != ''
        run: python3 social/tg.py send "${{ steps.skit.outputs.skit_id }}"
      - name: Save
        if: always()
        run: |
          python3 social/engine/migrate_library.py >/dev/null || true
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add assets/clips/library.json assets/brand social/library.json social/skit-prompts-state.json social/media social/captions social/pending.json
          git diff --cached --quiet && exit 0
          git commit -qm "skit built"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
