name: app-check
# Temporary read-only check (MarginMart ads debugging, 12 Nov 2026). Deleted right after.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { T: "${{ secrets.META_TOKEN }}", A: "${{ secrets.META_ADS_TOKEN }}", ID: "${{ secrets.META_APP_ID }}", SEC: "${{ secrets.META_APP_SECRET }}" }
    steps:
      - run: |
          G=https://graph.facebook.com/v23.0
          for k in T A; do v=${!k}; echo "== key $k"; curl -sS "$G/debug_token?input_token=$v&access_token=$v" | python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print(d.get("app_id"), d.get("application"), d.get("type"))'; done
          PT=$(curl -sS "$G/1296793536861294?fields=access_token&access_token=$T" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))')
          [ -z "$PT" ] && PT=$T
          echo "== Vajra page posts: app"; curl -sS "$G/1296793536861294/posts?fields=id,application,created_time&limit=6&access_token=$PT" | python3 -c 'import json,sys; [print(p["id"][-10:], p.get("created_time"), (p.get("application") or {}).get("name"), (p.get("application") or {}).get("id")) for p in json.load(sys.stdin).get("data",[])]'
          echo "== app 971433526020162 mode"; curl -sS "$G/971433526020162?fields=name&access_token=$ID|$SEC"; echo
          curl -sS "$G/$ID?fields=name&access_token=$ID|$SEC"; echo " (META_APP_ID)"
