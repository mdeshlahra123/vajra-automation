name: add-photos
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { GEMINI_FREE_KEY: "${{ secrets.GEMINI_FREE_KEY }}", GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
    steps:
      - uses: actions/checkout@v4
      - run: python3 social/engine/add_photo.py
      - run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add assets/photos; git diff --cached --quiet && exit 0
          git commit -qm "bot: inbox photos -> library"; for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 4; done; exit 1
