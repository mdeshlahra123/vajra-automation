name: add-photos
# Process photos/videos from inbox into the unified library
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { GEMINI_FREE_KEY: "${{ secrets.GEMINI_FREE_KEY }}", GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
    steps:
      - uses: actions/checkout@v4
      - run: (timeout 240 sudo apt-get install -y -qq libgl1 libegl1 libgles2 >/dev/null || true); pip install -q faster-whisper mediapipe pillow numpy || true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 social/engine/add_media.py
      - run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add social/library.json assets/photos assets/clips; git diff --cached --quiet && exit 0
          git commit -qm "bot: inbox media -> unified library"; for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 4; done; exit 1
