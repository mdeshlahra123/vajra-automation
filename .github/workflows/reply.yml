name: reply
on:
  schedule:
    - cron: "17 * * * *"    # hourly
  workflow_dispatch:
    inputs:
      dryrun: { description: "true = preview only", required: true, default: "true" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write, issues: write }
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Reply to comments
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.dryrun }}' -eq 'true') { ./social/auto-reply.ps1 -DryRun } else { ./social/auto-reply.ps1 }
      - name: Save state
        if: always()
        run: |
          git config user.name "vajra-bot"
          git config user.email "vajra-bot@users.noreply.github.com"
          git add social
          git diff --cached --quiet && exit 0
          git commit -m "bot: ${{ github.workflow }} $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="ALERT: ${{ github.workflow }} job failed"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length' | grep -qv '^0$'; then
            gh issue comment $(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number') --body "Failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "$title" --body "The **${{ github.workflow }}** job failed at $(date -u '+%F %H:%M') UTC. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Close this issue once fixed."
          fi
