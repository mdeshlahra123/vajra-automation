name: tg-probe
# Manual check: send a video to Telegram by URL and by upload, download what Telegram stored, and report its audio.
on:
  workflow_dispatch:
    inputs:
      url: { description: "video URL", required: true }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      URL: ${{ github.event.inputs.url }}
    steps:
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          api = f"https://api.telegram.org/bot{os.environ['TOKEN']}/"
          def stored(res, tag):
              v = res["result"].get("video") or res["result"].get("animation") or res["result"].get("document") or {}
              print(tag, "kind:", [k for k in ("video", "animation", "document") if k in res["result"]], "meta:", {k: v.get(k) for k in ("mime_type", "duration", "width", "height", "file_size")})
              f = json.load(urllib.request.urlopen(api + "getFile?file_id=" + v["file_id"]))["result"]["file_path"]
              urllib.request.urlretrieve(f"https://api.telegram.org/file/bot{os.environ['TOKEN']}/{f}", tag + ".mp4")
              print(tag, subprocess.run(["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name", "-of", "csv", tag + ".mp4"], capture_output=True, text=True).stdout.replace("\n", " "))
              print(tag, subprocess.run(["ffmpeg", "-hide_banner", "-i", tag + ".mp4", "-af", "volumedetect", "-f", "null", "-"], capture_output=True, text=True).stderr.split("mean_volume")[-1][:30])
          r = json.loads(subprocess.run(["curl", "-s", api + "sendVideo", "-F", f"chat_id={os.environ['CHAT']}", "-F", f"video={os.environ['URL']}",
                                         "-F", "caption=🔧 test (by URL)", "-F", "supports_streaming=true"], capture_output=True, text=True).stdout)
          stored(r, "by_url")
          urllib.request.urlretrieve(os.environ["URL"], "src.mp4")
          print("source", subprocess.run(["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,codec_name,channels", "-of", "csv", "src.mp4"], capture_output=True, text=True).stdout.replace("\n", " "))
          PY
