name: publish-now
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: state, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: (timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null || true); python3 -u social/publish_site.py
      - name: Save
        if: always()
        run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add social; git diff --cached --quiet && exit 0
          git commit -qm "bot: publish reel file to website"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
