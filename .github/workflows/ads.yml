name: ads
# Daily ads check (cron-job.org 08:30 IST). Only pauses/resumes existing ads; never touches budgets or money.
on:
  workflow_dispatch:
    inputs:
      dry: { description: "true = report only", required: false, default: "false" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  ads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DRY_RUN: ${{ github.event.inputs.dry }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 social/ads_manager.py
      - name: Daily Google Flow brief (what to make with free credits)
        if: github.event.inputs.dry != 'true'
        continue-on-error: true
        timeout-minutes: 6
        run: python3 social/flow_brief.py
      - name: Save state
        if: always()
        run: |
          git config user.name "vajra-bot"; git config user.email "vajra-bot@users.noreply.github.com"
          git add social/ads-state.json social/flow-state.json 2>/dev/null; git diff --cached --quiet && exit 0
          git commit -m "bot: ads $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
