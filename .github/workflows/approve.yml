name: approve
# Telegram approvals. Started by cron-job.org every 30 min (07:00-23:00 IST) with mode=poll,
# or by other workflows / manually with mode=send and an item id from social/pending.json.
on:
  workflow_dispatch:
    inputs:
      mode: { description: "poll / send", required: true, default: "poll" }
      id: { description: "pending item id (send only)", required: false, default: "" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          if [ "${{ github.event.inputs.mode }}" = "send" ]; then python3 social/tg.py send "${{ github.event.inputs.id }}"; else python3 social/tg.py poll; fi
      - name: Publish approved media to website
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess
          p = json.load(open("social/pending.json", encoding="utf-8"))
          todo = [i for i in p["items"] if i.get("publish") == "todo"]
          if not todo: raise SystemExit(0)
          if not os.environ.get("WEBSITE_TOKEN"): raise SystemExit("WEBSITE_TOKEN secret missing - approved reels can't be published")
          url = f"https://x-access-token:{os.environ['WEBSITE_TOKEN']}@github.com/mdeshlahra123/vajraformwork.git"
          subprocess.run(["git", "clone", "-q", "--depth", "1", url, "site"], check=True)
          for i in todo:
              shutil.copy(i["file"], os.path.join("site", "social", os.path.basename(i["file"]))); i["publish"] = "done"
          g = lambda *a: subprocess.run(["git", "-C", "site", *a], check=True)
          g("config", "user.name", "vajra-bot"); g("config", "user.email", "vajra-bot@users.noreply.github.com")
          g("add", "social"); g("commit", "-q", "-m", "bot: approved reels " + ", ".join(i["id"] for i in todo)); g("push", "-q")
          json.dump(p, open("social/pending.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("published", [i["id"] for i in todo])
          PY
      - name: Save state
        if: always()
        run: |
          git config user.name "vajra-bot"
          git config user.email "vajra-bot@users.noreply.github.com"
          git add social
          git diff --cached --quiet && exit 0
          git commit -m "bot: approve ${{ github.event.inputs.mode }} $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
