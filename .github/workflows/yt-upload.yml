name: yt-upload
# Manual: upload posted reels that have no YouTube id yet (last 3 days), or one reel by id.
on:
  workflow_dispatch:
    inputs:
      id: { description: "queue id (empty = all missed in last 3 days)", required: false, default: "" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  yt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 social/yt_upload.py ${{ github.event.inputs.id }}
        env: { YT_TOKEN: "${{ secrets.YT_TOKEN }}" }
      - if: always()
        run: |
          git config user.name "vajra-bot"; git config user.email "vajra-bot@users.noreply.github.com"
          git add social; git diff --cached --quiet && exit 0
          git commit -m "bot: yt upload"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1