name: post
on:
  # Started by cron-job.org at 09:30 (reel) and 19:30 (image) IST. GitHub's own schedule was removed: it ran hours late and crossed midnight.
  workflow_dispatch:
    inputs:
      type: { description: "reel / image", required: true, default: "image" }
      dryrun: { description: "true = upload test, no publish", required: true, default: "false" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write, issues: write }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Daily website update (approved reels in, old reels out)
        if: github.event.inputs.type == 'reel' && github.event.inputs.dryrun != 'true'
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: (sudo apt-get install -y -qq ffmpeg >/dev/null || true); python3 social/publish_site.py
      - name: Post
        shell: pwsh
        run: |
          $type = '${{ github.event.inputs.type }}'
          if (-not $type) { $type = if ('${{ github.event.schedule }}' -eq '23 4 * * *') { 'reel' } else { 'image' } }
          if ('${{ github.event.inputs.dryrun }}' -eq 'true') { ./social/daily-post.ps1 -Type $type -DryRun } else { ./social/daily-post.ps1 -Type $type }
      - name: YouTube Shorts upload (own channel; audit passed 28 Oct)
        if: github.event.inputs.dryrun != 'true'
        continue-on-error: true
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: python3 social/yt_upload.py
      - name: Unique daily Story (not a copy of the post)
        if: github.event.inputs.dryrun != 'true'
        continue-on-error: true
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: (which ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null); python3 social/story.py
      - name: Save state
        if: always()
        run: |
          git config user.name "vajra-bot"
          git config user.email "vajra-bot@users.noreply.github.com"
          git add social
          git diff --cached --quiet && exit 0
          git commit -m "bot: ${{ github.workflow }} $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="ALERT: ${{ github.workflow }} job failed"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length' | grep -qv '^0$'; then
            gh issue comment $(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number') --body "Failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "$title" --body "The **${{ github.workflow }}** job failed at $(date -u '+%F %H:%M') UTC. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Close this issue once fixed."
          fi
