name: story
# Manual: make + post one Story now to Instagram AND Facebook (dry=true: render only, frames sent to Telegram).
# format: quiz / poll / faq / myth / tip / teaser / clip (blank = next in rotation)
on:
  workflow_dispatch:
    inputs:
      dry: { description: "true = don't post", required: false, default: "false" }
      format: { description: "story format (blank = rotate)", required: false, default: "" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: (which ffmpeg >/dev/null || timeout 240 sudo apt-get install -y -qq ffmpeg >/dev/null || true); pip install -q pillow numpy
      - run: |
          F="${{ github.event.inputs.format }}"; D=""; [ "${{ github.event.inputs.dry }}" = "true" ] && D="--dry"
          python3 social/story.py $D ${F:+--format $F}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: story, path: work/stories, if-no-files-found: ignore }
      - run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add social/story-state.json social/media-usage.json 2>/dev/null || true; git diff --cached --quiet && exit 0
          git commit -qm "bot: story"; for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 4; done; exit 1