name: story
# Manual: make + post one unique Story now (dry=true: image only, sent to Telegram for a look).
on:
  workflow_dispatch:
    inputs:
      dry: { description: "true = don't post", required: false, default: "true" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
      GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: |
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then python3 social/story.py --dry; else python3 social/story.py; fi
          curl -s -F chat_id=$TELEGRAM_CHAT_ID -F photo=@work/story.jpg -F caption="Story preview (auto)" https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendPhoto >/dev/null
      - uses: actions/upload-artifact@v4
        with: { name: story, path: work/story.jpg }
      - run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          [ -f social/story-state.json ] || exit 0; git add social/story-state.json; git diff --cached --quiet && exit 0
          git commit -qm "bot: story"; for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 4; done; exit 1
