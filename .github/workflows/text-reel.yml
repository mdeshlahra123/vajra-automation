name: text-reel
# Weekly animated text reel (owner, 12 Nov). Saturday 10:00 IST; no voice, no AI video. Manual: format galtiyan|myth.
on:
  schedule:
    - cron: '30 4 * * 6'
  workflow_dispatch:
    inputs:
      format: { description: "galtiyan / myth (blank = rotate)", required: false, default: "" }
concurrency: { group: state, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: timeout 300 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null'; pip install -q pillow
      - run: F="${{ github.event.inputs.format }}"; python3 social/engine/text_reel.py ${F:+--format $F}
      - name: Save
        if: always()
        run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add social assets; git diff --cached --quiet && exit 0
          git commit -qm "bot: text reel"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1