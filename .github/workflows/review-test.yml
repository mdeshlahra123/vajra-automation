name: review-test
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: |
          cd social/engine && python3 - <<'PY'
          import json, os, review_reel
          p = json.load(open("plans/reel-ai-1028-1002.json", encoding="utf-8"))
          spans = [(0, 3.73), (3.73, 8.13), (8.13, 11.97)]
          ph = {"godown": "stacks of new VAJRA sheets in the godown", "finish-column": "smooth finished concrete column", "r-workers": "workers with VAJRA sheets"}
          sc = []
          for (a, b), s, promised in zip(spans, p["scenes"], ["AI video: " + p["scenes"][0]["video_prompt"], "still photo: smooth finished concrete column", "still photo: workers with VAJRA sheets"]):
              sc.append({"start": a, "end": b, "vo": s["vo"], "text": s["text1"] + " / " + s["text2"], "promised": promised})
          os.makedirs("/tmp/rv", exist_ok=True)
          j = review_reel.review("../media/reel-ai-1028-1002.mp4", sc, "/tmp/rv")
          print(json.dumps(j, ensure_ascii=False, indent=1)); print(review_reel.summary(j))
          PY
