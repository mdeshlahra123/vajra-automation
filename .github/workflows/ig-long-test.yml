name: ig-long-test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u social/tmp/ig_long_test.py