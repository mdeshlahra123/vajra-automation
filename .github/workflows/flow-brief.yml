name: flow-brief
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 social/flow_brief.py
      - name: Save state
        run: |
          git config user.name vajra-bot; git config user.email vajra-bot@users.noreply.github.com
          git add social/flow-state.json; git diff --cached --quiet && exit 0
          git commit -qm "bot: flow state"; for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 4; done; exit 1
