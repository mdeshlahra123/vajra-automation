name: library
# Rebuild the media-library gallery page (/library) whenever Telegram media is saved, and once daily.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 7 * * *'   # 12:30 IST daily
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 social/build_library.py
